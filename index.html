/* WPS 2.0.2 – ruhiger, dynamischer Ambient-Hintergrund */
.screen{background:linear-gradient(125deg,#071c30 0%,#09283e 52%,#0b3447 100%)}
.screen:before{background:radial-gradient(circle,#1bb3b466 0%,#08758d30 43%,transparent 70%);filter:blur(24px)}
.screen:after{background:radial-gradient(circle,#1595a566 0%,#1e627b33 45%,transparent 72%);filter:blur(28px)}
@keyframes ambientA{0%{transform:translate3d(-7%,2%,0) scale(.93);opacity:.65}50%{transform:translate3d(10%,12%,0) scale(1.12);opacity:.95}100%{transform:translate3d(-4%,24%,0) scale(1.02);opacity:.73}}
@keyframes ambientB{0%{transform:translate3d(8%,-12%,0) scale(1);opacity:.58}50%{transform:translate3d(23%,-4%,0) scale(1.2);opacity:.9}100%{transform:translate3d(-6%,-20%,0) scale(.94);opacity:.7}}
@media(prefers-reduced-motion:reduce){.screen:before,.screen:after{animation:none}.screen-fade{animation:none}}
.screen-content{position:relative;text-shadow:0 2px 22px #061a2c55}
.screen-title{font-weight:500}
.screen.dash .screen-title{font-weight:500}
.screen-bottom{font-weight:300;letter-spacing:.02em}
.dash-panel{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}


/* 2.0.2 – deutlich sichtbare, aber ruhige Lichtbewegung */
.screen{background:linear-gradient(125deg,#06192b 0%,#09283e 48%,#0b3448 100%)}
.screen:before{width:95vw;height:95vw;right:-18vw;top:-24vw;background:radial-gradient(circle at center,rgba(34,207,204,.52) 0%,rgba(16,144,166,.30) 32%,rgba(12,93,121,.12) 53%,transparent 72%);filter:blur(12px);animation:ambientA2 13s ease-in-out infinite alternate;opacity:1}
.screen:after{width:85vw;height:85vw;left:-22vw;bottom:-28vw;background:radial-gradient(circle at center,rgba(19,155,184,.42) 0%,rgba(20,110,157,.23) 39%,transparent 70%);filter:blur(12px);animation:ambientB2 17s ease-in-out infinite alternate;opacity:1}
@keyframes ambientA2{0%{transform:translate3d(-17%,3%,0) scale(.85)}50%{transform:translate3d(2%,17%,0) scale(1.08)}100%{transform:translate3d(-25%,29%,0) scale(.95)}}
@keyframes ambientB2{0%{transform:translate3d(5%,-12%,0) scale(.9)}50%{transform:translate3d(32%,-22%,0) scale(1.08)}100%{transform:translate3d(48%,-4%,0) scale(.94)}}

/* 2.0.2: transparente Bahnhofsuhr und flexible Fotolayouts */

.screen.image-panel .screen-content{background:rgba(5,29,47,.84);padding:2.5vw 3vw;border-radius:16px;max-width:63vw;backdrop-filter:blur(3px)}
.screen.image-bottom .screen-body{align-items:flex-end}.screen.image-bottom .screen-content{padding:5vh 3vw 2vh;max-width:100%;width:100%;background:linear-gradient(0deg,rgba(4,24,40,.95),rgba(4,24,40,.72) 64%,transparent)}
.screen.image-bottom .screen-inner{padding-left:0;padding-right:0}.screen.image-bottom .screen-top,.screen.image-bottom .screen-bottom{margin-left:6.5vw;margin-right:6.5vw}.screen.image-bottom .screen-content .screen-title{max-width:95%}

.screen.dash.image-split .screen-inner{background:none}.screen.dash.image-split .media-shade{display:block;background:linear-gradient(90deg,#09283ef5,#09283e88)}
.image-edit-preview{aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;background:#09283e;margin:8px 0 4px;color:white}.image-edit-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.image-edit-preview .shade{position:absolute;inset:0}.image-edit-preview .copy{position:absolute;left:6%;bottom:14%;right:6%;font-size:clamp(12px,2.5vw,22px);font-weight:500;text-shadow:0 1px 5px #0006}.image-edit-preview .copy small{display:block;font-size:.55em;font-weight:400;margin-top:6px}.image-edit-preview.side .shade{background:linear-gradient(90deg,#09283ef5,#09283eaa 45%,transparent 90%)}.image-edit-preview.panel .copy{background:#09283ee8;padding:15px;border-radius:8px;right:25%}.image-edit-preview.bottom .shade{background:linear-gradient(0deg,#09283ef0,transparent 55%)}.image-edit-preview.split img{left:43%;width:57%}.image-edit-preview.split .shade{background:linear-gradient(90deg,#09283e 43%,transparent 43%)}.image-edit-preview.split .copy{right:60%}

.tile-greeting{flex:1}.tile-greeting h1{font-size:clamp(28px,3.4vw,74px);font-weight:300;line-height:1.08;margin:0}.tile-greeting p{font-size:clamp(13px,1.1vw,25px);margin:.6vh 0 0;color:#587481}

.tile-feature h2{font-size:clamp(24px,2.55vw,58px);font-weight:400;line-height:1.13;margin:0;color:inherit}
.tile-feature p{font-size:clamp(13px,1.25vw,28px);line-height:1.3;margin:0;color:#587481}
.screen.tiles.dark .tile-feature p{color:#c0d7dd}
.tile-qr{position:absolute;right:1.5vw;bottom:1.3vw;width:min(7.2vw,130px);background:white;padding:6px;border-radius:8px}.tile-qr img{display:block;width:100%}
.tile-weather{padding:2vw;display:flex;flex-direction:column;justify-content:center;gap:1vw}
.tile-weather-row{display:flex;align-items:center;gap:1.5vw}.tile-weather-icon{font-size:clamp(35px,4.5vw,100px)}.tile-temp{font-size:clamp(32px,4vw,90px);font-weight:300;line-height:1}

  if(JSON.stringify(id==='settings'?before.settings:before.override)!==JSON.stringify(id==='settings'?value:value.value)){
   await api('app_state',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,data:value,updated_at:new Date().toISOString()})});

function tilePhase(){
 const full=fullRotationItems();
 const tilesPerFull=Math.max(1,Math.min(10,Math.round(Number(data.settings.tilesPerFullscreen)||3)));
 const tileDuration=20000;
 const elapsed=Math.max(0,Date.now()-displaySessionStart);
 if(!full.length){
  const slot=Math.floor(elapsed/tileDuration);
  return {key:'tiles-'+slot,fullscreen:false,tileSlot:slot};
 }
 const cycle=full.reduce((sum,c)=>sum+Math.max(5000,(Number(c.duration)||12)*1000)+tilesPerFull*tileDuration,0);

 for(const c of full){
  const duration=Math.max(5000,(Number(c.duration)||12)*1000);
  if(offset<duration)return {key:'full-'+cycleIndex+'-'+c.id,fullscreen:true,item:c};
  offset-=duration;
  const tileBlock=tilesPerFull*tileDuration;
  if(offset<tileBlock){
   const tileSlot=dashboardOffset+Math.floor(offset/tileDuration);
   return {key:'tiles-'+cycleIndex+'-'+c.id+'-'+tileSlot,fullscreen:false,tileSlot};
  }
  offset-=tileBlock;
  dashboardOffset+=tilesPerFull;

   const left=`<div class="screen editorial-full agenda-full"><div class="editorial-wrap"><section class="editorial-left"><div class="editorial-top"><img class="editorial-logo" src="assets/logo-light.svg" alt="WPS">${data.settings.showClock?railwayClock():''}</div><div class="editorial-main"><div class="editorial-eyebrow">HEUTE BEI DER WPS</div><div class="editorial-title" id="editorialFitTitle">${escapeHtml(w.title).replace(/\n/g,'<br>')}</div><div class="editorial-subtitle">${escapeHtml(w.subtitle||'')}</div>${editorialMetadata({eventDate:w.date,eventTime:w.start,eventLocation:w.room})}</div><div class="editorial-bottom"><div class="editorial-footer">WPS Workplace Solutions</div></div></section>${agendaRight(c,now)}</div></div>`;
   swapScreen(left,'agenda-'+c.id);updateRailwayClock();requestAnimationFrame(fitEditorialTitle);document.fonts?.ready.then(fitEditorialTitle);return;
  }
  lastRenderedWelcomeId=null;currentItem=c;started=Date.now();
  const url=c.media&&/^https:\/\//.test(c.media)?c.media:'';
  const pos=Math.max(0,Math.min(100,Number(c.imagePosition??50)));
  const photo=url?(c.kind==='video'?`<video id="activeVideo" src="${escapeHtml(url)}" autoplay muted playsinline preload="auto"></video>`:`<img src="${escapeHtml(url)}" alt="" style="object-position:${pos}% center">`):'<div class="editorial-no-image"></div>';

 currentItem=c;started=Date.now();const media=c.media&&/^https:\/\//.test(c.media)?c.media:'';const imagePosition=Math.max(0,Math.min(100,Number(c.imagePosition??50)));const mediaHtml=c.kind!=='video'&&media?`<img class="screen-media" style="object-position:${imagePosition}% center" src="${escapeHtml(media)}" alt="">`:c.kind==='video'&&media?`<video id="activeVideo" class="screen-media" src="${escapeHtml(media)}" autoplay muted playsinline preload="auto"></video>`:'';const events=upcoming().slice(0,3);const dashboard=data.settings.layout==='dashboard'&&!activeWelcomes.length&&!isOverride;const imageLayout=c.kind!=='video'&&media?'image-'+(c.imageLayout||'side'):'';const isWelcome=c.kind==='welcome';const qr=c.qr&&/^https:\/\//.test(c.qr)?`<div class="screen-qr"><span class="tile-qr-label">${escapeHtml(c.qrLabel||'Mehr Infos')}</span><img alt="QR-Code" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(c.qr)}"></div>`:'';

function fitEventTitle(){
 const el=document.getElementById('eventFitTitle');if(!el)return;
 const body=el.closest('.screen-body'),content=el.closest('.screen-content');if(!body||!content)return;
 // Keep a consistent editorial scale, shrink only when text or the whole block needs it.
 const viewportScale=Math.min(window.innerWidth/1920,window.innerHeight/1080);
 const isVisit=!!el.closest('.welcome-visit');
 const max=isVisit?Math.min(88*viewportScale,window.innerWidth*.046):Math.min(66*viewportScale,window.innerWidth*.0345);
 const min=Math.max(24*viewportScale,18);
 const title=(el.textContent||'').trim();
 const manualLines=title.split(/\r?\n/).length;
 const maxLines=Math.max(4,Math.min(8,manualLines+2));
 // Prefer readable word wrapping and moderate sizes for long titles.
 const preferred=isVisit?(title.length>125?50:title.length>90?58:title.length>65?68:88):(title.length>125?42:title.length>90?48:title.length>65?55:66);
 let low=min,high=Math.max(min,Math.min(max,preferred*viewportScale)),best=low;
 el.style.hyphens='none';el.style.wordBreak='normal';el.style.overflowWrap='normal';
 for(let n=0;n<16;n++){
  const mid=(low+high)/2;el.style.fontSize=mid+'px';
  const lineHeight=parseFloat(getComputedStyle(el).lineHeight)||mid*1.16;
  const lineCount=Math.round(el.getBoundingClientRect().height/lineHeight);
  const fits=content.scrollHeight<=body.clientHeight-12*viewportScale && el.scrollWidth<=el.clientWidth+2 && lineCount<=maxLines;
  if(fits){best=mid;low=mid}else high=mid;
 }
 el.style.fontSize=best+'px';
 // Very long unbreakable tokens may need an emergency wrap, never discretionary hyphenation.
 if(el.scrollWidth>el.clientWidth+2)el.style.overflowWrap='anywhere';
}
window.addEventListener('resize',()=>{if(document.getElementById('eventFitTitle'))fitEventTitle()});
startApp();
setInterval(()=>{if(session&&!document.body.classList.contains('display-mode')&&!document.querySelector('#modal.open'))refresh()},60000);
